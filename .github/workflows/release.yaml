name: release

# Builds and verifies rc-foundry release artifacts. It does NOT upload to PyPI.
#
# - Tag push (v1.0.0, v1.0.0rc1, ...): the gate job checks that the tagged
#   commit is on production and that its test, integration and lint runs
#   passed; release.py checks that the tag matches pyproject.toml's version.
#   The sdist and wheel are then built from a clean checkout of the tagged
#   commit, installed into a fresh venv outside the checkout, and smoke-tested
#   for every extra. The result is saved as the `dist` artifact of the run.
# - Manual run (workflow_dispatch): the same build + smoke test, as a dry run.
# - Pull requests touching packaging metadata or release tooling: the same
#   build + smoke test, so a broken extra is caught at review time.
#
# Uploading is a manual step: download the `dist` artifact from the tag's run
# and `twine upload` it with a PyPI token scoped to rc-foundry. There is
# deliberately no publish job. PyPI Trusted Publishing from this repo would let
# anyone with write access publish, by pushing a branch with an edited copy of
# this workflow: without a configurable deployment environment (not available
# on the RosettaCommons org's GitHub plan), PyPI can only check the repository
# and workflow filename. How to automate publishing safely is an open team
# decision.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/release.yaml
      - .github/release.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs can be cancelled; tag and manual runs never are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # A release must come from a commit that was reviewed and tested: it must
    # be on `production` (which only takes reviewed PRs, given branch
    # protection) and the push-triggered test, integration and lint workflows
    # must have succeeded on exactly that commit. Enforced on tag pushes only;
    # PR and manual runs report the result as a warning, since their commits
    # are not on production yet.
    name: gate (commit on production, tests passed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # read workflow runs for this commit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # full history of all branches, for the ancestry check
          persist-credentials: false
      - name: Commit is on production
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/production; then
            echo "ok: $GITHUB_SHA is on production"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::$GITHUB_SHA ($GITHUB_REF_NAME) is not on production. Release tags must point at a commit merged to production."
            exit 1
          else
            echo "::warning::$GITHUB_SHA is not on production (expected for PR and branch runs; would block a release)."
          fi
      - name: Tests passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=0
          for wf in test.yaml test_integration.yaml lint_production.yaml; do
            # Latest push-triggered run of this workflow on exactly this commit.
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion // "none") \(.html_url)"')
            if [ -z "$run" ]; then
              msg="$wf: no push-triggered run found on $GITHUB_SHA"
            else
              read -r status conclusion url <<< "$run"
              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                echo "ok: $wf succeeded ($url)"
                continue
              elif [ "$status" != "completed" ]; then
                msg="$wf is still $status on $GITHUB_SHA; re-run this workflow once it finishes ($url)"
              else
                msg="$wf concluded '$conclusion' on $GITHUB_SHA ($url)"
              fi
            fi
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::$msg"
              failed=1
            else
              echo "::warning::$msg"
            fi
          done
          exit $failed

  build:
    name: build sdist + wheel
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here uses git auth; don't leave GITHUB_TOKEN in .git/config
          # where later steps (pip, the build backend) could read it.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --no-cache-dir --require-hashes -r .github/requirements-pip-bootstrap.txt
          pip install build packaging
      - name: Verify tag matches pyproject.toml version
        # On a tag push, refuse unless the tag is exactly v<version>. On a manual
        # run there is no tag, so only the version's canonical form is checked.
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python .github/release.py verify "$GITHUB_REF_NAME"
          else
            python .github/release.py verify
          fi
      - name: Build
        # Builds the sdist, then the wheel from that sdist, from this clean
        # checkout of the tagged commit.
        run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    name: smoke test (${{ matrix.extra }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # Report every broken extra, not just the first.
      fail-fast: false
      matrix:
        # Each extra gets its own fresh venv: a dependency missing from one
        # extra would be masked if another extra installed in the same env
        # happened to pull it in. `all` additionally catches conflicts that
        # only appear when the extras are combined. `imports` are the modules
        # that actually need the extra's dependencies (--help alone does not
        # load them). The rf3 extra is CUDA kernels (cuEquivariance), which
        # install on a CPU runner but cannot be exercised, so rf3 is checked
        # for install + pip check only. `dev` is covered by test.yaml.
        include:
          - extra: base
            imports: ""
          - extra: rfo
            imports: "rfo.cli rfo.cycling.cycle"
          - extra: rfd3
            imports: "rfd3.engine rfd3.inference.datasets"
          - extra: rfd3na
            imports: "rfd3na.engine rfd3na.inference.datasets"
          - extra: rf3
            imports: ""
          - extra: all
            imports: >-
              rfo.cli rfo.cycling.cycle rfd3.engine rfd3.inference.datasets
              rfd3na.engine rfd3na.inference.datasets
    env:
      EXTRA: ${{ matrix.extra }}
      IMPORTS: ${{ matrix.imports }}
    steps:
      # No source checkout: the wheel must work without the source tree on
      # sys.path. This is the "works in the repo, broken when installed" check.
      # Only the hash-pinned pip bootstrap file is fetched, so pip is installed
      # the same way as in every other workflow (see #409).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/requirements-pip-bootstrap.txt
          sparse-checkout-cone-mode: false
          path: bootstrap
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Install wheel into a fresh venv
        # No ci-constraints here: resolve dependencies the way a user's
        # `pip install rc-foundry[<extra>]` would.
        run: |
          wheel=$(ls dist/*.whl)
          if [ "$EXTRA" = "base" ]; then spec="$wheel"; else spec="$wheel[$EXTRA]"; fi
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --no-cache-dir --require-hashes -r bootstrap/.github/requirements-pip-bootstrap.txt
          /tmp/venv/bin/python -m pip install "$spec"
          /tmp/venv/bin/python -m pip check
      - name: Import packages and run CLI entry points
        working-directory: /tmp
        run: |
          /tmp/venv/bin/python -c "import rf3, rfd3, rfd3na, mpnn, rfo, foundry_cli"
          for mod in $IMPORTS; do
            echo "import $mod"
            /tmp/venv/bin/python -c "import $mod"
          done
          for cli in rf3 rfd3 rfd3na mpnn rfo foundry; do
            echo "::group::$cli --help"
            /tmp/venv/bin/$cli --help
            echo "::endgroup::"
          done
