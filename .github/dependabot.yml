version: 2
updates:
  # Hash-pinned pip bootstrap used by the CI workflows.
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "pip"

  # uv image in the example Dockerfile.
  - package-ecosystem: "docker"
    directory: "/examples/docker"
    schedule:
      interval: "weekly"

  # GitHub Actions used by the workflows. release.yaml pins actions to full
  # commit SHAs (with a "# vX.Y.Z" comment); Dependabot updates both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
